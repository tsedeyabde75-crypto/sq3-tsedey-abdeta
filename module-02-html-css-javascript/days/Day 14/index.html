<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethio Telecom Dashboard Rebuild</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">Ethio Telecom</div>
      <nav class="nav-links">
        <a href="#">Services</a>
        <a href="#">Support</a>
        <button class="btn">My Account</button>
      </nav>
    </header>

    <aside class="sidebar">
      <nav class="menu">
        <a href="#" class="active">Dashboard</a>
        <a href="#">Packages</a>
        <a href="#">Bill Payment</a>
        <a href="#">Usage History</a>
      </nav>
    </aside>

    <main class="main">
      <h2>Account Overview</h2>
      
      <section class="cards">
        <div class="card">
          <span class="badge">Active</span>
          <h3>Voice Balance</h3>
          <p class="stat">120 Mins</p>
        </div>
        <div class="card">
          <span class="badge sale">ETB Sale</span>
          <h3>Data Balance</h3>
          <p class="stat">15.5 GB</p>
        </div>
        <div class="card">
          <h3>SMS Balance</h3>
          <p class="stat">450 SMS</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Ethio Telecom Rebuild. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
