<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Facts Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Country Facts Finder</h1>
    
    <form id="search-form">
      <input 
        type="text" 
        id="country-input" 
        placeholder="Enter country name (e.g. Ethiopia)" 
        autocomplete="off"
        required
      >
      <button type="submit">Search</button>
    </form>

    <section id="facts" class="facts-card"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
