<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Addis Eats</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-box { max-width: 400px; margin: 100px auto; padding: 2rem; background: var(--card-bg); border-radius: 8px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username (admin)" required style="width:100%; margin-bottom:1rem;">
      <input type="password" id="password" placeholder="Password (admin123)" required style="width:100%; margin-bottom:1rem;">
      <button type="submit" style="width:100%;">Login</button>
    </form>
    <p id="loginError" style="color:red; display:none;">Invalid credentials.</p>
  </div>
  <script src="admin-login.js"></script>
</body>
</html>
