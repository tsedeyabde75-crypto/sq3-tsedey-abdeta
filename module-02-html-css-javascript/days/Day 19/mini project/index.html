<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Market Shopping List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Addis Market Shopping List</h1>

    <form id="add-form">
      <input type="text" id="item-name" name="item-name" placeholder="Item name (e.g., Coffee)" autocomplete="off" required>
      <input type="number" id="price" placeholder="Price in ETB" min="1" step="any" required>
      <button type="submit">Add Item</button>
    </form>

    <ul id="list"></ul>

    <div class="total-container">
      <strong>Total: </strong><span id="total">0</span> ETB
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
